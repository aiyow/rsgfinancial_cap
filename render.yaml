services:
  - type: web
    name: rsg-condo-api
    runtime: docker
    region: singapore
    # Deployment must preserve an SMTP-capable instance and existing mail settings.
    # The protected export preflight fails closed if SMTP/TLS or encryption fails.
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: true
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: SOA_PROTECTED_EXPORTS_ENABLED
        value: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SOA_REMINDER_SCHEDULER_ENABLED
        value: true
      - key: SOA_REMINDER_TIMEZONE
        value: Asia/Manila
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_RECEIPTS_FOLDER
        sync: false

  - type: web
    name: rsg-condo-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
